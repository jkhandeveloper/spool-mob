name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The API the built app talks to (baked into the bundle at build time).
  EXPO_PUBLIC_API_URL: https://api.spool.zasstech.com/api/v1

jobs:
  check:
    name: Typecheck, lint, bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate typed routes
        run: npx expo customize tsconfig.json
      - run: npm run typecheck
      - run: npx eslint src
      - name: Bundle for all platforms
        run: npx expo export --output-dir dist

  android:
    name: Android APK
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the APK
        id: apk
        run: |
          name="spool-$(node -p "require('./app.json').expo.version")-${GITHUB_SHA::7}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

  ios:
    name: iOS app (unsigned .ipa)
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Generate native iOS project (runs pod install)
        run: npx expo prebuild --platform ios --clean
      - name: Build release app for devices (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Spool.xcworkspace \
            -scheme Spool \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200
      # An unsigned .ipa can't be installed as-is. Sign it on your computer with
      # your Apple ID (Sideloadly / AltStore), or add signing to this job (see README).
      - name: Package .ipa
        id: ipa
        run: |
          name="spool-$(node -p "require('./app.json').expo.version")-${GITHUB_SHA::7}-unsigned.ipa"
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Spool.app Payload/
          zip -qry "$name" Payload
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa.outputs.name }}
          path: ${{ steps.ipa.outputs.name }}
          retention-days: 30
