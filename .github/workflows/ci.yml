name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The API the built app talks to (baked into the bundle at build time).
  EXPO_PUBLIC_API_URL: https://api.spoolapp.net/api/v1

jobs:
  check:
    name: Typecheck, tests, lint, bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate typed routes
        run: npx expo customize tsconfig.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - name: Bundle for all platforms
        run: npx expo export --output-dir dist

  android:
    name: Android (APK + Play .aab)
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Google Play needs a higher versionCode for every upload. The run number
      # only goes up; raise the offset if versionCodes were ever used elsewhere
      # (for example by an EAS build uploaded to Play).
      ANDROID_VERSION_CODE_OFFSET: 0
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Version
        id: version
        run: |
          code=$(( GITHUB_RUN_NUMBER + ANDROID_VERSION_CODE_OFFSET ))
          name=$(node -p "require('./app.json').expo.version")
          echo "ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "package=$(node -p "require('./app.json').expo.android.package")" >> "$GITHUB_OUTPUT"
          echo "Android versionName $name, versionCode $code" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the Play upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Warn when the upload key is missing
        if: env.HAS_UPLOAD_KEY != 'true'
        run: echo "::warning::ANDROID_UPLOAD_KEYSTORE_BASE64 is not set, so the APK is debug-signed and no Play .aab is built."
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build release APK and .aab
        working-directory: android
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ "$HAS_UPLOAD_KEY" = true ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi
      - name: Name the outputs
        id: out
        run: |
          base="spool-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-${GITHUB_SHA::7}"
          mv android/app/build/outputs/apk/release/app-release.apk "$base.apk"
          echo "apk=$base.apk" >> "$GITHUB_OUTPUT"
          if [ "$HAS_UPLOAD_KEY" = true ]; then
            mv android/app/build/outputs/bundle/release/app-release.aab "$base.aab"
            echo "aab=$base.aab" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.apk }}
          path: ${{ steps.out.outputs.apk }}
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: steps.out.outputs.aab != ''
        with:
          name: ${{ steps.out.outputs.aab }}
          path: ${{ steps.out.outputs.aab }}
          retention-days: 90
      # Optional: sends the .aab to Play's internal testing track. Google requires
      # the app's first .aab to be uploaded by hand in Play Console. While the app
      # has never been published, Play only accepts draft releases, so roll each
      # one out from Play Console (or change PLAY_RELEASE_STATUS to "completed" later).
      - name: Upload to Google Play (internal testing)
        if: github.ref == 'refs/heads/main' && steps.out.outputs.aab != '' && env.HAS_PLAY_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.version.outputs.package }}
          releaseFiles: ${{ steps.out.outputs.aab }}
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

  ios:
    name: iOS app (unsigned .ipa)
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Generate native iOS project (runs pod install)
        run: npx expo prebuild --platform ios --clean
      - name: Build release app for devices (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Spool.xcworkspace \
            -scheme Spool \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200
      # An unsigned .ipa can't be installed as-is. Sign it on your computer with
      # your Apple ID (Sideloadly / AltStore), or add signing to this job (see README).
      - name: Package .ipa
        id: ipa
        run: |
          name="spool-$(node -p "require('./app.json').expo.version")-${GITHUB_SHA::7}-unsigned.ipa"
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Spool.app Payload/
          zip -qry "$name" Payload
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa.outputs.name }}
          path: ${{ steps.ipa.outputs.name }}
          retention-days: 30

  ios-simulator:
    name: iOS Simulator build (Appetize)
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Generate native iOS project (runs pod install)
        run: npx expo prebuild --platform ios --clean
      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Spool.xcworkspace \
            -scheme Spool \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200
      - name: Package Appetize archive
        id: simulator
        run: |
          name="spool-$(node -p "require('./app.json').expo.version")-${GITHUB_SHA::7}-simulator.zip"
          cd build-simulator/Build/Products/Release-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/$name" Spool.app
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.simulator.outputs.name }}
          path: ${{ steps.simulator.outputs.name }}
          retention-days: 30
